<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - TurkFlix BD</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ================= ULTRA PREMIUM THEME ================= */
:root[data-theme="dark"] { 
  --bg-1: #05050f; --bg-2: #14062b; 
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
  --glass-border: rgba(255,255,255,0.15); 
  --glass-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1), inset 0 10px 20px -10px rgba(255,255,255,0.3);
  --text: #ffffff; --text-muted: #a0a0b0; 
  --neon-1: #00e5ff; --neon-2: #ff00e5; --neon-3: #a855f7; --gold: #ffd700; 
}
:root[data-theme="light"] { 
  --bg-1: #e6ecff; --bg-2: #f5f0ff; 
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
  --glass-border: rgba(255,255,255,0.6); 
  --glass-shadow: 0 10px 40px rgba(31,38,135,0.15), inset 0 0 0 1px rgba(255,255,255,0.8), inset 0 10px 20px -10px rgba(255,255,255,0.9);
  --text: #1a1a2e; --text-muted: #555; 
  --neon-1: #0077ff; --neon-2: #d500f9; --neon-3: #6200ea; --gold: #ff8f00; 
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
  margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; 
  background: linear-gradient(135deg, var(--bg-1), var(--bg-2)); background-attachment: fixed; 
  color: var(--text); min-height: 100vh; padding-bottom: 50px; overflow-x: hidden;
}

/* ================= 3D GLASS CARDS ================= */
.glass-card { 
  background: var(--glass-bg); 
  backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); 
  border: 1px solid var(--glass-border); border-radius: 24px; 
  box-shadow: var(--glass-shadow); 
  padding: 22px; margin-bottom: 16px; position: relative; overflow: hidden; 
}
.glass-card::before { 
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; 
  background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, transparent 100%); 
  border-radius: 24px 24px 0 0; pointer-events: none; 
}

/* ================= HEADER & TABS ================= */
.glass-header { 
  position: sticky; top: 0; margin: 0; padding: 16px 20px; z-index: 100; 
  background: rgba(5,5,16,0.85); backdrop-filter: blur(25px); 
  border-bottom: 1px solid var(--glass-border); 
  display: flex; justify-content: space-between; align-items: center; 
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.text-3d { 
  font-weight: 900; font-size: 1.6rem; margin: 0; 
  background: linear-gradient(135deg, var(--neon-1), var(--neon-3)); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
  filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.5)) drop-shadow(0px 0px 15px var(--neon-3)); 
}
.text-3d-sm { font-weight: 900; font-size: 1.1rem; color: var(--text); text-shadow: 0 2px 5px rgba(0,0,0,0.8), 0 0 10px var(--neon-1); }

.admin-tabs { display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none; background: rgba(0,0,0,0.3); }
.admin-tabs::-webkit-scrollbar { display: none; }
.tab-btn { 
  padding: 12px 20px; white-space: nowrap; 
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); 
  border: 1px solid var(--glass-border); border-radius: 16px; 
  color: var(--text-muted); cursor: pointer; font-size: 0.9rem; font-weight: 800; 
  transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.2); 
}
.tab-btn.active { 
  background: linear-gradient(135deg, var(--neon-1), var(--neon-3)); 
  color: white; border: none; 
  box-shadow: 0 8px 25px rgba(168,85,247,0.5), inset 0 2px 3px rgba(255,255,255,0.4); 
  transform: translateY(-3px); text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* ================= BUTTONS & INPUTS ================= */
.glass-btn { 
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); 
  border: 1px solid var(--glass-border); color: var(--text); 
  padding: 14px 22px; border-radius: 16px; font-weight: 800; cursor: pointer; 
  transition: all 0.15s; font-size: 0.95rem; 
  box-shadow: 0 6px 15px rgba(0,0,0,0.4), inset 0 2px 2px rgba(255,255,255,0.3), inset 0 -2px 2px rgba(0,0,0,0.2); 
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.glass-btn:active { transform: scale(0.94) translateY(3px); box-shadow: 0 2px 5px rgba(0,0,0,0.4), inset 0 2px 5px rgba(0,0,0,0.4); }
.glass-btn.primary { 
  background: linear-gradient(135deg, var(--neon-1), var(--neon-3)); 
  border: none; color: white; width: 100%; padding: 16px; 
  box-shadow: 0 10px 30px rgba(168,85,247,0.6), inset 0 2px 3px rgba(255,255,255,0.5); 
  font-size: 1rem; font-weight: 900;
}
.glass-btn.danger { 
  background: linear-gradient(135deg, #ff3b3b, #ff0066); border: none; color: white; 
  box-shadow: 0 8px 20px rgba(255,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.4); 
}

.glass-input, select.glass-input { 
  width: 100%; padding: 16px 18px; 
  background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); 
  border-radius: 16px; color: var(--text); font-size: 0.95rem; margin-bottom: 15px; outline: none; 
  box-shadow: inset 0 4px 8px rgba(0,0,0,0.5), 0 1px 1px rgba(255,255,255,0.1); 
  font-weight: 700; transition: border 0.3s;
}
.glass-input:focus { border-color: var(--neon-1); box-shadow: inset 0 4px 8px rgba(0,0,0,0.5), 0 0 15px var(--neon-1); }
select.glass-input option { background: var(--bg-1); color: white; font-weight: 600; }

/* ================= LAYOUT & GRIDS ================= */
.admin-content { padding: 16px; }
.admin-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--glass-border); font-size: 0.95rem; }
.admin-row:last-child { border: none; padding-bottom: 0; }

.stat-box { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stat-item { 
  background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(0,0,0,0.3)); 
  padding: 20px; border-radius: 20px; text-align: center; 
  border: 1px solid var(--glass-border); 
  box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.3); 
}
.stat-item h4 { margin: 0; font-size: 0.8rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-item p { margin: 10px 0 0; font-size: 2rem; font-weight: 900; color: var(--neon-1); text-shadow: 0 3px 15px rgba(0,229,255,0.6); }

.section-title { font-size: 1.2rem; font-weight: 900; margin: 20px 0 15px; display: flex; align-items: center; gap: 10px; text-shadow: 0 3px 10px rgba(0,0,0,0.6); }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 0.9rem; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

/* ================= LOADER ================= */
.loader-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-1); z-index: 9999; }
.coin-3d { font-size: 6rem; animation: coin-spin 2s infinite ease-in-out; filter: drop-shadow(0 0 40px var(--gold)); }
@keyframes coin-spin { 0%, 100% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.2); } }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="adminApp">
  <div id="loader" class="loader-screen"><div class="coin-3d">⚙️</div><h1 class="text-3d">Admin Panel</h1><p style="font-weight:bold; margin-top:15px;">লোড হচ্ছে...</p></div>

  <div id="adminMain" class="hidden">
    <header class="glass-header">
      <h2 class="text-3d">⚙️ Admin</h2>
      <button class="glass-btn" onclick="location.href='index.html'" style="padding:10px 16px; font-size:0.9rem;">← App</button>
    </header>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="dashboard">📊 Stats</button>
      <button class="tab-btn" data-tab="videos">📹 Videos</button>
      <button class="tab-btn" data-tab="categories">📂 Categories</button>
      <button class="tab-btn" data-tab="pending">⏳ Pending</button>
      <button class="tab-btn" data-tab="users">👥 Users</button>
      <button class="tab-btn" data-tab="withdrawals">💸 Withdrawals</button>
      <button class="tab-btn" data-tab="settings">🪙 Settings</button>
    </div>

    <div class="admin-content" id="adminContent"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const cfg = { 
  SUPABASE_URL: 'https://ttqrlrgdehwkoabiamty.supabase.co', 
  SUPABASE_ANON_KEY: 'sb_publishable_6SU40N9QJZfPxsWYkIepSA_1PBOMvIl', 
  ADMIN_TELEGRAM_ID: 7609414654, 
  WORKER_URL: 'https://mute-term-3df1.mdranjusadik4.workers.dev' 
};
const supabase = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const tg = window.Telegram?.WebApp;
let currentUser = null; let currentTab = 'dashboard';

async function init() {
  if (tg) { tg.ready(); tg.expand(); }
  if (!tg?.initDataUnsafe?.user) { document.getElementById('loader').innerHTML = '<p style="padding:20px;text-align:center;color:white;font-weight:bold;">Telegram Bot থেকে খুলুন</p>'; return; }
  
  const u = tg.initDataUnsafe.user;
  const { data } = await supabase.rpc('get_user_data', { p_telegram_id: u.id });
  
  if (!data || !data.is_admin) { 
      document.getElementById('loader').innerHTML = '<p style="padding:20px;text-align:center;color:#ff6b6b;font-weight:bold;font-size:1.2rem;">❌ আপনি Admin নন</p>'; 
      return; 
  }
  
  currentUser = data;
  document.getElementById('loader').classList.add('hidden'); 
  document.getElementById('adminMain').classList.remove('hidden');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => { 
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
        btn.classList.add('active'); 
        currentTab = btn.dataset.tab; 
        renderTab(); 
    };
  });
  renderTab();
}

async function renderTab() {
  const c = document.getElementById('adminContent');
  c.innerHTML = '<p style="text-align:center;padding:20px;font-weight:bold;color:var(--neon-1);">Loading...</p>';
  if (currentTab === 'dashboard') await renderDashboard(c);
  else if (currentTab === 'videos') await renderVideos(c);
  else if (currentTab === 'categories') await renderCategories(c);
  else if (currentTab === 'pending') await renderPending(c);
  else if (currentTab === 'users') await renderUsers(c);
  else if (currentTab === 'withdrawals') await renderWithdrawals(c);
  else if (currentTab === 'settings') await renderSettings(c);
}

async function renderDashboard(c) {
  const [users, videos, pending, withdrawals] = await Promise.all([
    supabase.from('users').select('id', { count: 'exact', head: true }),
    supabase.from('videos').select('id', { count: 'exact', head: true }),
    supabase.from('videos').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
    supabase.from('withdrawals').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
  ]);
  const { data: wallets } = await supabase.from('coin_wallets').select('balance');
  const totalCoins = (wallets || []).reduce((s, w) => s + w.balance, 0);

  c.innerHTML = `
    <div class="stat-box">
      <div class="stat-item"><h4>Total Users</h4><p>${users.count || 0}</p></div>
      <div class="stat-item"><h4>Total Videos</h4><p>${videos.count || 0}</p></div>
      <div class="stat-item"><h4>Pending Videos</h4><p>${pending.count || 0}</p></div>
      <div class="stat-item"><h4>Pending WDs</h4><p>${withdrawals.count || 0}</p></div>
      <div class="stat-item" style="grid-column:1/-1; background:linear-gradient(135deg, rgba(255,215,0,0.1), rgba(0,0,0,0.3)); border-color:var(--gold);">
        <h4>Total Coins in System</h4><p style="color:var(--gold); text-shadow:0 0 15px var(--gold);">🪙 ${totalCoins}</p>
      </div>
    </div>`;
}

// ================= CATEGORIES =================
async function renderCategories(c) {
  const { data: cats } = await supabase.from('video_categories').select('*').order('created_at', { ascending: true });
  
  c.innerHTML = `
    <div class="glass-card">
      <h3 class="text-3d-sm" style="margin-top:0; margin-bottom:18px;">➕ নতুন ক্যাটাগরি তৈরি করুন</h3>
      <div class="form-group">
        <label>ক্যাটাগরির নাম</label>
        <input class="glass-input" id="newCatName" placeholder="যেমন: কমেডি / Funny">
      </div>
      <div class="form-group">
        <label>আইকন (ইমোজি)</label>
        <input class="glass-input" id="newCatIcon" placeholder="যেমন: 😂" maxlength="2">
      </div>
      <button class="glass-btn primary" id="addCatBtn">Add Category</button>
    </div>

    <h3 class="section-title">📂 সকল ক্যাটাগরি</h3>
    ${(cats || []).map(cat => `
      <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; padding:18px; margin-bottom:12px;">
        <div style="font-weight:900; font-size:1.15rem; display:flex; align-items:center; gap:12px;">
          <span style="font-size:1.8rem; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5));">${cat.icon || '📁'}</span> ${cat.name}
        </div>
        <button class="glass-btn danger" onclick="window.deleteCat('${cat.id}')" style="padding:10px 14px;">🗑</button>
      </div>
    `).join('')}`;

  document.getElementById('addCatBtn').onclick = async () => {
    const name = document.getElementById('newCatName').value.trim(); 
    const icon = document.getElementById('newCatIcon').value.trim() || '📁';
    
    if (!name) return alert('ক্যাটাগরির নাম দিন');

    let slug = name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, ''); 
    if (slug === '' || slug === '-') {
      slug = 'cat-' + Date.now(); 
    }

    const { error } = await supabase.from('video_categories').insert({ name, slug, icon, is_active: true });
    
    if (error) { 
      if (error.code === '23505') return alert('এই ক্যাটাগরি আগেই আছে!'); 
      return alert('Error: ' + error.message); 
    }
    alert('✅ ক্যাটাগরি তৈরি হয়েছে!'); 
    renderCategories(c);
  };

  window.deleteCat = async (id) => { 
      if (!confirm('আপনি কি নিশ্চিত? এই ক্যাটাগরির ভিডিওগুলো আন-ক্যাটাগরাইজড হয়ে যাবে।')) return; 
      await supabase.from('video_categories').delete().eq('id', id); 
      renderCategories(c); 
  };
}

// ================= VIDEOS =================
async function renderVideos(c) {
  const { data: videos } = await supabase.from('videos').select('*').order('created_at', { ascending: false }).limit(50);
  const { data: cats } = await supabase.from('video_categories').select('*').eq('is_active', true);

  c.innerHTML = `
    <div class="glass-card">
      <h3 class="text-3d-sm" style="margin-top:0; margin-bottom:18px; color:var(--neon-1);">➕ Add YouTube Video</h3>
      <div class="form-group"><input class="glass-input" id="ytUrl" placeholder="https://youtube.com/watch?v=..."></div>
      <div class="form-group">
        <select class="glass-input" id="ytCat">
          ${(cats || []).map(cat => `<option value="${cat.id}">${cat.icon} ${cat.name}</option>`).join('')}
        </select>
      </div>
      <button class="glass-btn primary" id="addYtBtn">Add YouTube Video</button>
    </div>

    <div class="glass-card" style="border: 1px solid var(--gold); box-shadow: 0 10px 40px rgba(255,215,0,0.15);">
      <h3 class="text-3d-sm" style="margin-top:0; margin-bottom:18px; color:var(--gold);">📱 Upload from Gallery</h3>
      <div class="form-group"><input class="glass-input" id="upTitle" placeholder="Video Title"></div>
      
      <div class="form-group">
        <select class="glass-input" id="upCat">
          ${(cats || []).map(cat => `<option value="${cat.id}">${cat.icon} ${cat.name}</option>`).join('')}
        </select>
      </div>

      <!-- থাম্বনেইল আপলোড অপশন -->
      <div class="form-group">
        <label style="color:var(--gold); font-weight:bold; margin-bottom:5px; display:block;">Thumbnail (Optional Image)</label>
        <input type="file" id="upThumb" accept="image/*" style="color:var(--text); font-weight:bold; padding:10px 0;">
      </div>

      <div class="form-group">
        <label style="color:var(--neon-1); font-weight:bold; margin-bottom:5px; display:block;">Video File</label>
        <input type="file" id="upFile" accept="video/mp4,video/webm" style="color:var(--text); font-weight:bold; padding:10px 0;">
      </div>
      
      <button class="glass-btn primary" id="upBtn" style="background:linear-gradient(135deg, var(--gold), #ff9500); color:#000;">Upload Video</button>
      <p id="upProgress" style="text-align:center;font-size:0.9rem;color:var(--gold);margin-top:12px; font-weight:800;"></p>
    </div>

    <h3 class="section-title">📹 All Videos (${(videos || []).length})</h3>
    ${(videos || []).map(v => `
      <div class="glass-card" style="padding:18px;">
        <div class="admin-row">
          <div>
            <div style="font-weight:800; font-size:1rem; margin-bottom:6px;">${esc(v.title)}</div>
            <div style="font-size:0.8rem;color:var(--text-muted);font-weight:700;">
              <span style="color:var(--neon-2);">${v.source_type.toUpperCase()}</span> | 
              <span style="color:${v.status === 'approved' ? '#4ade80' : v.status === 'pending' ? '#ffa500' : '#ff6b6b'};">${v.status.toUpperCase()}</span> | 
              👁${v.view_count} ❤${v.like_count}
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            ${v.status === 'pending' ? `
              <button class="glass-btn" onclick="window.approveVid('${v.id}')" style="background:#4ade80;color:#000; padding:10px 14px; box-shadow:0 4px 10px rgba(74,222,128,0.4);">✅</button>
              <button class="glass-btn danger" onclick="window.rejectVid('${v.id}')" style="padding:10px 14px;">❌</button>
            ` : ''}
            <button class="glass-btn danger" onclick="window.deleteVid('${v.id}')" style="padding:10px 14px;">🗑</button>
          </div>
        </div>
      </div>
    `).join('')}`;

  // YouTube Add Logic
  document.getElementById('addYtBtn').onclick = async () => {
    const url = document.getElementById('ytUrl').value.trim(); const catId = document.getElementById('ytCat').value; const ytId = extractYouTubeId(url);
    if (!ytId) return alert('Invalid YouTube URL');
    let title = 'YouTube Video'; let thumb = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
    try { const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`); const j = await r.json(); title = j.title; } catch {}
    
    const { data: newVideo, error } = await supabase.from('videos').insert({ title, youtube_id: ytId, source_type: 'youtube', thumbnail_url: thumb, category_id: catId, status: 'approved', published_at: new Date().toISOString() }).select().single();
    if (error) return alert('Error: ' + error.message); 
    
    fetch(`${cfg.WORKER_URL}/auto-post`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ videoId: newVideo.id, title, thumbnail_url: thumb, youtube_id: ytId })
    }).then(r => r.json()).then(data => {
      if (data.results) {
        const failed = data.results.filter(x => !x.success);
        if (failed.length > 0) alert('ভিডিও অ্যাড হয়েছে, কিন্তু অটো-পোস্ট ব্যর্থ:\n' + failed.map(f => f.error).join('\n'));
        else alert('✅ YouTube ভিডিও যোগ হয়েছে এবং গ্রুপ/চ্যানেলে পোস্ট করা হয়েছে!');
      }
    }).catch(e => console.error(e));
    renderVideos(c);
  };

  // Gallery Upload Logic (With Thumbnail)
  document.getElementById('upBtn').onclick = async () => {
    const title = document.getElementById('upTitle').value.trim(); 
    const catId = document.getElementById('upCat').value; 
    const file = document.getElementById('upFile').files[0]; 
    const thumbFile = document.getElementById('upThumb').files[0]; // নতুন
    const prog = document.getElementById('upProgress');

    if (!title || !file) return alert('Title এবং Video File দুটোই দিন'); 
    if (file.size > 50 * 1024 * 1024) return alert('ফাইল সাইজ ৫০MB এর কম হতে হবে');
    
    prog.textContent = '⏳ ভিডিও আপলোড হচ্ছে... অপেক্ষা করুন';
    const fileName = `vid_${Date.now()}_${file.name}`;
    
    // ভিডিও আপলোড
    const { error: uploadErr } = await supabase.storage.from('videos').upload(fileName, file);
    if (uploadErr) { prog.textContent = ''; return alert('Video Upload Error: ' + uploadErr.message); }
    
    const { data: urlData } = supabase.storage.from('videos').getPublicUrl(fileName);
    const videoUrl = urlData.publicUrl;

    // থাম্বনেইল আপলোড (যদি দেওয়া হয়)
    let thumbUrl = null;
    if (thumbFile) {
        prog.textContent = '⏳ থাম্বনেইল আপলোড হচ্ছে...';
        const thumbName = `thumb_${Date.now()}_${thumbFile.name}`;
        const { error: thumbErr } = await supabase.storage.from('videos').upload(thumbName, thumbFile);
        
        if (!thumbErr) {
            const { data: thumbData } = supabase.storage.from('videos').getPublicUrl(thumbName);
            thumbUrl = thumbData.publicUrl;
        }
    }

    prog.textContent = '⏳ ডাটাবেসে সেভ হচ্ছে...';

    // ডাটাবেসে সেভ (thumbnail_url সহ)
    const { data: newVideo, error: dbErr } = await supabase.from('videos').insert({ 
        title, 
        source_type: 'upload', 
        video_url: videoUrl, 
        thumbnail_url: thumbUrl, 
        category_id: catId, 
        status: 'approved', 
        published_at: new Date().toISOString() 
    }).select().single();
    
    if (dbErr) { prog.textContent = ''; return alert('DB Error: ' + dbErr.message); }
    
    // অটো পোস্ট (গ্রুপে)
    fetch(`${cfg.WORKER_URL}/auto-post`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ videoId: newVideo.id, title, thumbnail_url: thumbUrl, youtube_id: null })
    }).then(r => r.json()).then(data => {
      prog.textContent = '✅ সফলভাবে আপলোড হয়েছে!';
      if (data.results) {
        const failed = data.results.filter(x => !x.success);
        if (failed.length > 0) alert('ভিডিও আপলোড হয়েছে, কিন্তু অটো-পোস্ট ব্যর্থ:\n' + failed.map(f => f.error).join('\n'));
      }
    }).catch(e => console.error(e));
    
    setTimeout(() => prog.textContent = '', 3000); 
    renderVideos(c);
  };

  window.approveVid = async (id) => { await supabase.from('videos').update({ status: 'approved', published_at: new Date().toISOString() }).eq('id', id); renderVideos(c); };
  window.rejectVid = async (id) => { if (!confirm('Reject?')) return; await supabase.from('videos').update({ status: 'rejected' }).eq('id', id); renderVideos(c); };
  window.deleteVid = async (id) => { if (!confirm('Delete permanently?')) return; await supabase.from('videos').delete().eq('id', id); renderVideos(c); };
}

async function renderPending(c) {
  const { data } = await supabase.from('videos').select('*').eq('status', 'pending').order('created_at', { ascending: false });
  c.innerHTML = `
    <h3 class="section-title">⏳ Pending (${(data || []).length})</h3>
    ${(data || []).length ? data.map(v => `
      <div class="glass-card">
        <div style="font-weight:900; font-size:1.1rem; margin-bottom:8px;">${esc(v.title)}</div>
        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px;font-weight:700;">
          ${v.source_type.toUpperCase()} | ${new Date(v.created_at).toLocaleString('bn')}
        </div>
        ${v.video_url ? `<video src="${v.video_url}" controls style="width:100%;border-radius:16px;margin-bottom:15px;border:1px solid var(--glass-border); box-shadow:0 5px 15px rgba(0,0,0,0.4);"></video>` : ''}
        <div style="display:flex;gap:12px;">
          <button class="glass-btn" onclick="window.approveVid('${v.id}')" style="flex:1; background:#4ade80;color:#000; font-weight:900;">✅ Approve</button>
          <button class="glass-btn danger" onclick="window.rejectVid('${v.id}')" style="flex:1; font-weight:900;">❌ Reject</button>
        </div>
      </div>
    `).join('') : '<p style="text-align:center;color:var(--text-muted);padding:30px;font-weight:bold;">কোনো pending ভিডিও নেই</p>'}`;
  
  window.approveVid = async (id) => { await supabase.from('videos').update({ status: 'approved', published_at: new Date().toISOString() }).eq('id', id); renderPending(c); };
  window.rejectVid = async (id) => { await supabase.from('videos').update({ status: 'rejected' }).eq('id', id); renderPending(c); };
}

async function renderUsers(c) {
  const { data } = await supabase.from('users').select('*').order('created_at', { ascending: false }).limit(50);
  const { data: wallets } = await supabase.from('coin_wallets').select('*'); 
  const walletMap = Object.fromEntries((wallets || []).map(w => [w.user_id, w]));
  
  c.innerHTML = `
    <h3 class="section-title">👥 Users (${(data || []).length})</h3>
    ${(data || []).map(u => { 
      const w = walletMap[u.id] || { balance: 0 }; 
      return `
        <div class="glass-card">
          <div style="display:flex;gap:16px;align-items:center;">
            <img src="${u.photo_url || 'https://via.placeholder.com/40'}" style="width:50px;height:50px;border-radius:50%;border:2px solid var(--neon-1); object-fit:cover; box-shadow:0 0 10px var(--neon-1);">
            <div style="flex:1">
              <div style="font-weight:900; font-size:1.1rem;">${esc(u.first_name || 'User')} ${u.is_banned ? '🚫' : ''}</div>
              <div style="font-size:0.85rem;color:var(--text-muted);font-weight:700; margin-top:5px;">ID: ${u.telegram_id} | 🪙 ${w.balance}</div>
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:15px;">
            <button class="glass-btn" onclick="window.adjustCoins(${u.telegram_id})" style="flex:1; background:linear-gradient(135deg, var(--gold), #ff9500); color:#000; font-weight:800;">🪙 Adjust</button>
            ${u.is_banned 
              ? `<button class="glass-btn" onclick="window.unbanUser(${u.telegram_id})" style="flex:1; background:#4ade80;color:#000; font-weight:800;">✅ Unban</button>` 
              : `<button class="glass-btn danger" onclick="window.banUser(${u.telegram_id})" style="flex:1; font-weight:800;">🚫 Ban</button>`}
          </div>
        </div>`;
    }).join('')}`;
  
  window.adjustCoins = async (tgId) => { 
    const amt = parseInt(prompt('কয়েন পরিমাণ (+ যোগ / - বিয়োগ):')); 
    if (!amt) return; 
    const reason = prompt('কারণ:') || 'Admin adjustment'; 
    const { error } = await supabase.rpc('admin_adjust_coins', { p_admin_tg: tg.initDataUnsafe.user.id, p_target_tg: tgId, p_amount: amt, p_reason: reason }); 
    if (error) return alert('Error: ' + error.message); 
    alert('সফল!'); 
    renderUsers(c); 
  };
  window.banUser = async (tgId) => { if (!confirm('Ban?')) return; await supabase.from('users').update({ is_banned: true }).eq('telegram_id', tgId); renderUsers(c); };
  window.unbanUser = async (tgId) => { await supabase.from('users').update({ is_banned: false }).eq('telegram_id', tgId); renderUsers(c); };
}

async function renderWithdrawals(c) {
  const { data } = await supabase.from('withdrawals').select('*, users(first_name, telegram_id)').order('created_at', { ascending: false }).limit(50);
  
  c.innerHTML = `
    <h3 class="section-title">💸 Withdrawals</h3>
    ${(data || []).length ? data.map(w => `
      <div class="glass-card">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px; align-items:flex-start;">
          <div>
            <div style="font-weight:900; font-size:1.2rem; color:var(--gold);">🪙 ${w.coins_amount} = ৳${w.bdt_amount}</div>
            <div style="font-size:0.85rem;color:var(--text-muted); margin-top:8px; font-weight:700;">
              ${esc(w.users?.first_name || 'User')} | ${w.payment_method.toUpperCase()}: <span style="color:var(--text);">${w.payment_number}</span>
            </div>
          </div>
          <span style="color:${w.status === 'completed' ? '#4ade80' : w.status === 'rejected' ? '#ff6b6b' : '#ffa500'};font-weight:900; text-shadow:0 0 10px currentColor;">${w.status.toUpperCase()}</span>
        </div>
        ${w.status === 'pending' ? `
          <div style="display:flex;gap:12px;">
            <button class="glass-btn" onclick="window.completeWd('${w.id}')" style="flex:1;background:#4ade80;color:#000; font-weight:900;">✅ Complete</button>
            <button class="glass-btn danger" onclick="window.rejectWd('${w.id}', ${w.coins_amount}, '${w.users?.telegram_id}')" style="flex:1; font-weight:900;">❌ Reject & Refund</button>
          </div>` : ''}
      </div>
    `).join('') : '<p style="text-align:center;color:var(--text-muted);padding:30px;font-weight:bold;">কোনো উইথড্রয়াল নেই</p>'}`;
  
  window.completeWd = async (id) => { await supabase.from('withdrawals').update({ status: 'completed', processed_at: new Date().toISOString() }).eq('id', id); renderWithdrawals(c); };
  window.rejectWd = async (id, coins, tgId) => { 
    await supabase.from('withdrawals').update({ status: 'rejected', processed_at: new Date().toISOString() }).eq('id', id); 
    await supabase.rpc('admin_adjust_coins', { p_admin_tg: tg.initDataUnsafe.user.id, p_target_tg: parseInt(tgId), p_amount: coins, p_reason: 'Withdrawal rejected - refund' }); 
    renderWithdrawals(c); 
  };
}

async function renderSettings(c) {
  const { data: s } = await supabase.from('reward_settings').select('*').eq('id', 1).single();
  
  c.innerHTML = `
    <div class="glass-card">
      <h3 class="text-3d-sm" style="margin-top:0; margin-bottom:20px; color:var(--gold);">🪙 Reward Settings</h3>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        ${[
          ['welcome_bonus_coins', 'Welcome Bonus'], ['video_watch_coins', 'Watch Reward'], 
          ['video_watch_min_seconds', 'Min Watch Sec'], ['like_coins', 'Like Reward'], 
          ['comment_coins', 'Comment Reward'], ['share_coins', 'Share Reward'], 
          ['referral_coins', 'Referral Reward'], ['daily_earning_limit', 'Daily Limit'], 
          ['coin_to_bdt_rate', 'Coin to BDT'], ['min_withdrawal_coins', 'Min Withdraw']
        ].map(([k, label]) => `
          <div class="form-group" style="margin-bottom:0;">
            <label>${label}</label>
            <input class="glass-input" type="number" data-key="${k}" value="${s[k]}" style="padding:12px; font-size:0.9rem;">
          </div>
        `).join('')}
      </div>

      <h4 style="margin:25px 0 15px 0; color:var(--neon-1); font-weight:900; text-shadow:0 0 10px rgba(0,229,255,0.5);">Enable/Disable Features</h4>
      ${[
        ['welcome_bonus_enabled', 'Welcome Bonus'], ['video_watch_enabled', 'Video Watch'], 
        ['like_enabled', 'Like'], ['comment_enabled', 'Comment'], 
        ['share_enabled', 'Share'], ['referral_enabled', 'Referral'], 
        ['withdrawal_enabled', 'Withdrawal']
      ].map(([k, label]) => `
        <div class="form-group" style="display:flex;align-items:center;gap:12px; padding:14px; background:rgba(0,0,0,0.25); border-radius:16px; margin-bottom:12px; border:1px solid var(--glass-border);">
          <input type="checkbox" data-toggle="${k}" ${s[k] ? 'checked' : ''} style="width:24px; height:24px; accent-color:var(--neon-1); cursor:pointer;">
          <label style="margin:0; font-size:1rem; font-weight:800; cursor:pointer;">${label} চালু</label>
        </div>
      `).join('')}
      
      <button class="glass-btn primary" id="saveSettings" style="margin-top:20px;">💾 Save Settings</button>
    </div>`;

  document.getElementById('saveSettings').onclick = async () => {
    const updates = {}; 
    c.querySelectorAll('input[data-key]').forEach(inp => { updates[inp.dataset.key] = parseInt(inp.value); }); 
    c.querySelectorAll('input[data-toggle]').forEach(inp => { updates[inp.dataset.toggle] = inp.checked; }); 
    updates.updated_at = new Date().toISOString();
    
    const { error } = await supabase.from('reward_settings').update(updates).eq('id', 1);
    if (error) return alert('Error: ' + error.message); 
    alert('✅ Settings saved!');
  };
}

function extractYouTubeId(url) { const m = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/); return m ? m[1] : null; }
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

init();
